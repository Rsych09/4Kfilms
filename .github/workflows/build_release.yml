name: Build Windows Application

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        python build_exe.py

    - name: Download TorrServer for bundle
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/YouROK/TorrServer/releases/latest/download/TorrServer-windows-386.exe" -OutFile "dist\TorrServer-windows-386.exe"

    - name: Create ZIP bundle
      shell: pwsh
      run: |
        Compress-Archive -Path dist\* -DestinationPath "PersonalCinema4K-Windows.zip" -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PersonalCinema4K-Windows
        path: PersonalCinema4K-Windows.zip

    - name: Create GitHub Release (on tag or manual)
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/PersonalCinema4K.exe
          PersonalCinema4K-Windows.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
